[project]
name = "agenthub"
version = "0.1.0"
description = "Self-hosted coordination hub for Claude Code agents"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "cryptography>=44",
]

[project.scripts]
agenthub = "agenthub.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenthub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
