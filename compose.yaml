# AgentHub szolgáltatások: API + Dashboard és PostgreSQL (SPECIFICATION 3.2).
# A Claude Code agentek NEM innen indulnak: kézzel, látható terminálban.
name: ${AGENTHUB_INSTANCE:-agenthub}

# naplómegőrzés: konténerenként legfeljebb 5 × 10 MB (SPECIFICATION 19)
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_DB: agenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a .env-ben kell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    logging: *logging
    user: "${AGENTHUB_UID:-1000}:${AGENTHUB_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      AGENTHUB_DATABASE_URL: postgresql+psycopg://agenthub:${POSTGRES_PASSWORD}@db:5432/agenthub
      AGENTHUB_SECRETS_DIR: /secrets
      AGENTHUB_NAME: ${AGENTHUB_NAME:-}
      AGENTHUB_DATA_DIR: /data
      AGENTHUB_ALLOW_PUBLIC: ${AGENTHUB_ALLOW_PUBLIC:-0}
      AGENTHUB_PROJECTS_ROOT_HOST: ${AGENTHUB_PROJECTS_ROOT:-}
    volumes:
      - ./secrets:/secrets:ro
      - ./data:/data
      # a Dashboard mappaválasztója: csak olvasható, csak könyvtárneveket listáz (üres = kikapcsolva)
      - ${AGENTHUB_PROJECTS_ROOT:-./data}:/projects-root:ro
    ports:
      - "${AGENTHUB_BIND:-0.0.0.0}:${AGENTHUB_PORT:-8790}:8000"

volumes:
  pgdata:
